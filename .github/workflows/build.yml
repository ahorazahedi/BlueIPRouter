name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build app bundle
        run: BUILD_NUMBER=${{ github.run_number }} sh scripts/build.sh --zip
      - name: Generated pf rules parse
        run: |
          printf 'table <t> persist { 192.0.2.0/24 2001:db8::/32 }\nblock drop out quick on lo0 to <t>\n' > /tmp/t.pf
          pfctl -nf /tmp/t.pf
      - uses: actions/upload-artifact@v4
        with:
          name: BlueIPRouter
          path: build/BlueIPRouter-*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/BlueIPRouter-*.zip
